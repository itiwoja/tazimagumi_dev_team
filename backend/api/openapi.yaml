openapi: 3.0.3
info:
  title: 田島組 男性スキンケア・ソムリエ API
  version: 0.1.0-mock
  description: |
    田島組 卒業制作アプリ（企画書 v3.0 準拠）のバックエンド API 仕様。
    11月中間発表向け MVP のフロントエンドが消費する契約として frontend レーンと共有する。

    薬機法ガードレール（企画書 §10）に従い、効能効果を断定する応答は返さない。
    推薦理由は事前テンプレートのスロット埋めで、自由生成は行わない。

  contact:
    name: tazimagumi backend lane
servers:
  - url: http://localhost:8080
    description: ローカル Spring Boot
  - url: https://mock.local/api
    description: モック JSON（バックエンド未起動時のフロント単体開発用）

tags:
  - name: skin-types
    description: 6タイプ TOP（即決UI）
  - name: diagnosis
    description: 23問詳細診断
  - name: recommendations
    description: 商品推薦
  - name: products
    description: 商品マスター
  - name: routines
    description: 朝・夜ステップ
  - name: shave-care
    description: 髭剃りケアモード

paths:
  /api/v1/skin-types:
    get:
      tags: [skin-types]
      summary: 6タイプ TOP のカード一覧を取得
      description: 企画書 §7.3 の6タイプ即決UIに表示する6枚のカード。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkinType'

  /api/v1/skin-types/{typeId}:
    get:
      tags: [skin-types]
      parameters:
        - $ref: '#/components/parameters/TypeIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkinType'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/diagnosis/questions:
    get:
      tags: [diagnosis]
      summary: 23問の質問一覧
      description: |
        企画書 §8.1 ② の23問。6セクション (基本情報3 / 肌タイプ判定5 / 悩み4 /
        髭剃りスタイル5 / 生活習慣3 / ケア環境3) の構造をそのまま返す。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiagnosisSection'

  /api/v1/diagnosis/sessions:
    post:
      tags: [diagnosis]
      summary: 診断セッションを開始
      description: |
        匿名セッション。クライアント側で sessionId を保持し、回答送信に使う。
        卒制スコープでは認証なしで運用、PII は送らない。
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisSession'

  /api/v1/diagnosis/sessions/{sessionId}/answers:
    put:
      tags: [diagnosis]
      summary: 回答を保存（上書き）
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    $ref: '#/components/schemas/DiagnosisAnswer'
      responses:
        '204':
          description: 保存完了
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/diagnosis/sessions/{sessionId}/evaluate:
    post:
      tags: [diagnosis]
      summary: 23問を評価して肌タイプ・推薦・ルーティンを返す
      description: |
        企画書 §8.1 ②〜⑤ をまとめて生成。
        判定ロジックは `docs/scoring-logic.md` 参照。
        薬機法対応のため、結果文言は事前テンプレートから組み立てる。
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 必須回答が不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/recommendations/by-type/{typeId}:
    get:
      tags: [recommendations]
      summary: 6タイプから即決導線で推薦商品を取得（ライト層）
      description: |
        TOP画面のカードクリックで使う。診断結果なしでもタイプIDだけで返せる。
        企画書 §7.3「ライト層 → 即座に推薦商品が表示される」に対応。
      parameters:
        - $ref: '#/components/parameters/TypeIdPath'
        - name: lineUse
          in: query
          description: ライン使い切替（同ブランド統一推薦）。企画書 §8.1 ③参照。
          schema:
            type: boolean
            default: false
        - name: budget
          in: query
          description: 上限予算（円）。3,000 / 6,000 / 10,000 など。
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationBundle'

  /api/v1/products:
    get:
      tags: [products]
      summary: 商品一覧
      parameters:
        - name: skinTypeId
          in: query
          schema: { type: string }
        - name: concernTag
          in: query
          schema: { type: string }
        - name: maxPriceJPY
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  /api/v1/products/{productId}:
    get:
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/routines/by-type/{typeId}:
    get:
      tags: [routines]
      summary: 6タイプに対応する朝・夜のケアルーティン
      parameters:
        - $ref: '#/components/parameters/TypeIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareRoutine'

  /api/v1/shave-care/ingredients:
    get:
      tags: [shave-care]
      summary: 髭剃り直後に刺激になりやすい成分マスター
      description: |
        企画書 §8.1 ⑥「髭剃り直後に刺激になりやすい成分」をタグとして提供。
        薬機法対応のため、「危険」表現は使わず「タイミングを選ぶ成分」として扱う。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShaveIrritantIngredient'

  /api/v1/shave-care/score/{productId}:
    get:
      tags: [shave-care]
      summary: 商品の刺激配慮スコア（5指標）
      description: |
        企画書 §8.1 ⑥ の刺激配慮スコア。
        指標：保湿力／低刺激／滑りの良さ／使用感／アフターケア。
        モック実装段階ではデモ用10商品のみ実装。
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShaveCareScore'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    TypeIdPath:
      name: typeId
      in: path
      required: true
      description: 6タイプの ID
      schema:
        type: string
        enum: [oily, dry, shave-care, pores, age-care, beginner]
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: 該当リソースなし
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    SkinType:
      type: object
      required: [id, name, headline, concerns, accentColor, recommendSetName, tags]
      properties:
        id:
          type: string
          enum: [oily, dry, shave-care, pores, age-care, beginner]
        name:
          type: string
          example: テカリ・皮脂タイプ
        headline:
          type: string
          description: TOPカードのキャッチコピー（薬機法 OK 表現）
          example: テカリ・皮脂が気になる
        concerns:
          type: array
          items: { type: string }
        accentColor:
          type: string
          description: タイプごとの色（OKLCH or hex）
          example: '#2A6F97'
        recommendSetName:
          type: string
          example: 皮脂コントロールセット
        tags:
          type: array
          items: { type: string }
        ageHint:
          type: string
          example: '15〜35歳'

    DiagnosisSection:
      type: object
      required: [sectionNo, title, questions]
      properties:
        sectionNo: { type: integer }
        title: { type: string }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisQuestion'

    DiagnosisQuestion:
      type: object
      required: [id, sectionNo, questionNoInSection, text, choices, isMultiSelect]
      properties:
        id: { type: string }
        sectionNo: { type: integer }
        questionNoInSection: { type: integer }
        sectionTitle: { type: string }
        text: { type: string }
        helpText:
          type: string
          description: 補足ヒント（任意）
        isMultiSelect: { type: boolean }
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'

    Choice:
      type: object
      required: [id, label, scoreByType]
      properties:
        id: { type: string }
        label: { type: string }
        scoreByType:
          type: object
          description: |
            選択肢ごとに、6タイプそれぞれへ何点加算するかの辞書。
            例: { "oily": 2, "dry": 0, "shave-care": 1 }
          additionalProperties:
            type: integer
        concernTags:
          type: array
          items: { type: string }

    DiagnosisSession:
      type: object
      required: [sessionId, createdAt]
      properties:
        sessionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    DiagnosisAnswer:
      type: object
      required: [questionId, selectedChoiceIds]
      properties:
        questionId: { type: string }
        selectedChoiceIds:
          type: array
          items: { type: string }

    DiagnosisResult:
      type: object
      required: [skinTypeId, scoresByType, concernTags, shaveBurdenLevel,
                 recommendations, routine, completedAt]
      properties:
        skinTypeId:
          type: string
          enum: [oily, dry, shave-care, pores, age-care, beginner]
        scoresByType:
          type: object
          additionalProperties: { type: integer }
        concernTags:
          type: array
          items: { type: string }
        shaveBurdenLevel:
          type: string
          enum: [low, mid, high]
        recommendations:
          $ref: '#/components/schemas/RecommendationBundle'
        routine:
          $ref: '#/components/schemas/CareRoutine'
        completedAt: { type: string, format: date-time }

    RecommendationBundle:
      type: object
      required: [skinTypeId, items, lineUseMode]
      properties:
        skinTypeId: { type: string }
        lineUseMode:
          type: boolean
          description: 同ブランド統一推薦が選ばれているか
        items:
          type: array
          description: 「あなたに必要な3アイテム」。1要素ごとに3価格帯を含む。
          items:
            $ref: '#/components/schemas/RecommendationSlot'

    RecommendationSlot:
      type: object
      required: [slotKey, slotLabel, candidates]
      properties:
        slotKey:
          type: string
          enum: [cleanser, lotion, moisturizer, after-shave, sunscreen, all-in-one]
        slotLabel:
          type: string
          example: 化粧水
        candidates:
          type: array
          description: お試し / 定番 / こだわり の3価格帯
          items:
            $ref: '#/components/schemas/RecommendationCandidate'

    RecommendationCandidate:
      type: object
      required: [product, priceTier, reason]
      properties:
        product:
          $ref: '#/components/schemas/Product'
        priceTier:
          type: string
          enum: [trial, standard, premium]
        reason:
          type: string
          description: |
            薬機法準拠の推薦理由（テンプレートを埋めた最終文）。
            自由生成ではなく `recommendation-templates.json` のテンプレを使う。
          example: 同じ肌タイプの方によく選ばれている

    Product:
      type: object
      required: [id, name, brand, priceJPY, priceTier, isMedicinal]
      properties:
        id: { type: string }
        name: { type: string }
        brand: { type: string }
        priceJPY: { type: integer }
        priceTier:
          type: string
          enum: [trial, standard, premium]
        category:
          type: string
          enum: [cleanser, lotion, moisturizer, after-shave, sunscreen, all-in-one]
        imageUrl: { type: string, format: uri, nullable: true }
        isMedicinal:
          type: boolean
          description: true=医薬部外品 / false=一般化粧品。表示できる効能タグが分岐する。
        ingredientTags:
          type: array
          items: { type: string }
        shaveIrritants:
          type: array
          items: { type: string }
        rakutenItemUrl:
          type: string
          format: uri
          nullable: true

    ProductPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    CareRoutine:
      type: object
      required: [morningSteps, eveningSteps]
      properties:
        morningSteps:
          type: array
          items: { $ref: '#/components/schemas/RoutineStep' }
        eveningSteps:
          type: array
          items: { $ref: '#/components/schemas/RoutineStep' }

    RoutineStep:
      type: object
      required: [order, label, durationSeconds]
      properties:
        order: { type: integer }
        label: { type: string, example: 洗顔 }
        productSlotKey:
          type: string
          enum: [cleanser, lotion, moisturizer, after-shave, sunscreen, all-in-one]
        durationSeconds: { type: integer, example: 60 }
        note:
          type: string
          description: 表現は薬機法 OK 言い換えテンプレートに沿うこと

    ShaveIrritantIngredient:
      type: object
      required: [id, displayName, severity, alternativeHint]
      properties:
        id: { type: string, example: ethanol }
        displayName: { type: string, example: エタノール }
        severity:
          type: string
          enum: [mild, moderate, strong]
        alternativeHint:
          type: string
          example: アルコールフリー化粧水を選ぶと安心です

    ShaveCareScore:
      type: object
      required: [productId, scores]
      properties:
        productId: { type: string }
        scores:
          type: object
          required: [moisture, lowIrritation, glide, feel, afterCare]
          properties:
            moisture: { type: integer, minimum: 1, maximum: 5 }
            lowIrritation: { type: integer, minimum: 1, maximum: 5 }
            glide: { type: integer, minimum: 1, maximum: 5 }
            feel: { type: integer, minimum: 1, maximum: 5 }
            afterCare: { type: integer, minimum: 1, maximum: 5 }

    Problem:
      type: object
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
