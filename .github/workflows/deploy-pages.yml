name: Deploy to Cloudflare Pages

# main へのマージをトリガーに、app/ を Cloudflare Pages へ自動公開する（Issue #80）。
# 公開対象は app/ の中身（ビルド不要のバニラ JS）で、Cloudflare Pages のプロジェクト直下に配置する。
#
# 【main を本番ブランチにする理由】develop で統合・通しデモ・CI確認を行い、main へのリリースPRを公開トリガーにする。
#   Cloudflare Pages 側の production branch も main に設定すること。
#   このため main へのマージは即座に公開へ反映される。develop は公開前の統合・通しデモ用に保つ。
#
# 【人間が一度だけ行う設定】Cloudflare Pages で Direct Upload のプロジェクトを作成し、初回作成時に
#   production branch を main にする。既存のDirect UploadプロジェクトはDashboardからproduction branch
#   controlsを変更できないため、Cloudflare APIのUpdate Project endpointでmainへ更新する。GitHub の Settings → Secrets and variables → Actions に
#   CLOUDFLARE_API_TOKEN（Pages Edit 権限）と CLOUDFLARE_ACCOUNT_ID を Secret として登録し、
#   CLOUDFLARE_PAGES_PROJECT_NAME を Repository variable として登録する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# 公開は同時に1本だけ。走行中に新しい push が来たら古い方をキャンセル。
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare Pages project setting
        env:
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Repository variable CLOUDFLARE_PAGES_PROJECT_NAME is not configured."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ] || [ -z "$API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN GitHub secrets are required."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deployment URL
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        shell: bash
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "Cloudflare Pages URL: $DEPLOYMENT_URL"
            {
              echo "### Cloudflare Pages deployment"
              echo "$DEPLOYMENT_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
