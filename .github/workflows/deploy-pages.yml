name: Deploy to GitHub Pages

# main へのマージをトリガーに、app/ を GitHub Pages へ自動公開する（Issue #80）。
# 公開ルートは app/（ビルド不要のバニラ JS）。相対パス運用のためサブパス /<repo>/ で動く。
#
# 【人間が一度だけ行う設定】リポジトリ Settings → Pages → Build and deployment →
#   Source を「GitHub Actions」に切り替える（管理者操作。これが無いと deploy-pages が失敗する）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。走行中に新しい push が来たら古い方をキャンセル。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (app/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
